[project]
name = "support-preflight"
version = "0.1.0"
description = "Synthetic customer-support environment with paired broken/fixed rewards for pre-flight diagnostics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["verifiers==0.3.2.dev80", "pydantic>=2.12,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support_preflight"]
