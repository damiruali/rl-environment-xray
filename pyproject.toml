[project]
name = "rl-environment-xray"
version = "0.1.0"
description = "Evidence-scoped pre-flight diagnostics for interactive agent environments"
requires-python = ">=3.12,<3.15"
dependencies = [
  "support-preflight", "networkx>=3.4,<4", "numpy>=2,<3",
  "scipy>=1.14,<2", "jinja2>=3.1.6,<4", "pydantic>=2.12,<3",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24", "ruff>=0.12", "build>=1.2", "prime"]

[tool.uv.sources]
support-preflight = { path = "environments/support_preflight", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray"]

[tool.hatch.build.targets.sdist]
exclude = ["/artifacts", "/environments/support_preflight/dist"]

[project.scripts]
rlxray = "xray.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
